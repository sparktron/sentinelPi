# Optional systemd drop-in for firewall and ARP active response.
# Install as /etc/systemd/system/sentinelpi.service.d/active-response.conf only
# after response.enabled is explicitly armed in sentinelpi.yaml.
[Service]
AmbientCapabilities=
AmbientCapabilities=CAP_NET_RAW CAP_NET_ADMIN
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN
